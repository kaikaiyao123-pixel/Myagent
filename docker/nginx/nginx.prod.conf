# =============================================================================
# AgentChat 生产 Nginx 配置
#
# 用途：静态托管前端 + 反向代理后端 API 与对象存储
#
# ⚠️ 与仓库原有 nginx_example.conf 的关键差异：
#    原文件只做静态托管，【缺少 /api 与 /minio 反代】，
#    直接用于生产会导致前端所有接口请求 404。
#
# ⚠️ SSE 是本项目的核心链路（对话流式输出）。
#    Nginx 默认会缓冲上游响应，导致 SSE 的 token 被攒成一整块再下发，
#    "打字机效果"消失。必须显式关闭缓冲，见下方 /api/ 段的注释。
# =============================================================================

# ⚠️ 关于 upstream 的写法（重要）：
#    Nginx 在【配置加载时】解析 upstream 里的主机名。若写成
#        upstream x { server backend:7860; }  +  proxy_pass http://x;
#    则容器启动时若 backend 尚未注册 DNS，nginx 会直接启动失败
#    （emerg: host not found in upstream "backend:7860"），导致前端整体不可用。
#    因此下面改用「resolver + 变量」写法，把解析推迟到【每次请求时】：
#    后端短暂不可用只会返回 502，而不会让 nginx 起不来。

server {
    listen 80;
    server_name _;                 # 占位：绑定域名后改为你的域名
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS；valid=10s 让新增/重启的容器能被及时感知
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 上传体积上限（知识库文档、头像、附件）
    client_max_body_size 200M;

    # ---------------------------------------------------------------------
    # 基础安全响应头
    # ---------------------------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------------------------------------------------------------
    # 压缩（注意：SSE 的 text/event-stream 不在列表中，避免缓冲流式内容）
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ---------------------------------------------------------------------
    # 1) 后端 API 反向代理（含 SSE 关键配置）
    # ---------------------------------------------------------------------
    location /api/ {
        # 变量写法：把 DNS 解析推迟到请求时（见文件头说明）
        set $backend_upstream "http://backend:7860";
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        # SSE 必须使用 HTTP/1.1 且清空 Connection，否则会被降级为短连接
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★★★ SSE 核心三件套：不关掉就看不到流式效果 ★★★
        proxy_buffering         off;   # 关闭响应缓冲，边收边发
        proxy_cache             off;   # 关闭缓存
        proxy_request_buffering off;   # 请求体也直传（大文件上传更友好）

        # 显式告诉后端"不要缓冲"（部分框架会读此头）
        proxy_set_header X-Accel-Buffering no;

        # 长连接超时：LLM 生成 + 多轮工具调用可能持续很久
        # 默认 60s 会导致长对话中途断开
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;

        # 关闭该段的压缩：压缩会引入缓冲，破坏流式
        gzip off;

        chunked_transfer_encoding on;
    }

    # ---------------------------------------------------------------------
    # 2) 对象存储反向代理
    #    后端返回的资源地址为相对路径 /minio/agentchat/xxx，
    #    这里剥掉 /minio 前缀转发到 MinIO。
    #    好处：与访问域名解耦，换 IP/域名无需改任何配置。
    #
    #    ⚠️ 踩坑记录（务必保留此顺序）：
    #       两个坑叠加，只有实测才会暴露：
    #       坑1：proxy_pass 用变量时若同时写了 URI（如 proxy_pass $var/;），
    #            该 URI 会【整体替换】原始请求 URI，
    #            即 /minio/agentchat/x.jpg → /  ✗
    #            （实测 MinIO 返回 AccessDenied，XML 里 <Resource>/</Resource>）
    #       坑2：`set` 与 `rewrite` 同属 rewrite 阶段，按书写顺序执行；
    #            而 rewrite 的 `break` 会【终止后续 rewrite 阶段指令】。
    #            若把 set 写在 rewrite 之后，set 永不执行 →
    #            变量为空 → 500 且日志报
    #            "using uninitialized variable" + "invalid URL prefix in \"\""。
    #       正确写法：set 在前，rewrite 在后，proxy_pass 不带 URI。
    # ---------------------------------------------------------------------
    location /minio/ {
        set $minio_upstream "http://minio:9000";      # 必须在 rewrite 之前
        rewrite ^/minio/(.*)$ /$1 break;

        proxy_pass $minio_upstream;      # 注意：末尾不带 URI，也不要加斜杠

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 图片/附件可缓存，减轻对象存储压力
        # 注意：这里用 expires/Cache-Control 做浏览器缓存即可；
        # 不配置 proxy_cache（未定义 cache zone 时 proxy_cache_valid 无意义且会告警）。
        proxy_buffering on;
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---------------------------------------------------------------------
    # 3) 前端静态资源
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;    # SPA 路由回退
    }

    # 带哈希的构建产物：长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不缓存，否则发版后用户拿到旧入口
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 健康检查（容器 HEALTHCHECK 用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }
}
