# ============================================================
# AgentChat Docker 部署配置模板
# ------------------------------------------------------------
# 使用方式：
#   cp docker_config.example.yaml docker_config.yaml
#   然后填入你自己的真实凭据
#
# 注意：docker_config.yaml 已在 .gitignore 中，不会被提交到仓库。
# ============================================================

# 服务配置
server:
  env: "dev" # prod / test / dev
  host: "127.0.0.1"
  port: 7860
  name: "AgentChat" # 项目名称
  version: "2.5.0" # 服务版本号

# 数据库配置：MySQL (请根据实际配置更改 endpoint)
# 格式：mysql+pymysql://<user>:<password>@<host>:<port>/<database>
mysql:
  endpoint: "mysql+pymysql://root:123456@mysql:3306/agentchat" # 同步连接配置
  async_endpoint: "mysql+aiomysql://root:123456@mysql:3306/agentchat" # 异步连接配置

# 缓存配置：Redis
redis:
  endpoint: "redis://redis:6379" # Redis 连接地址

# 多模型服务配置 (LLM、Embedding、Rerank)
multi_models:
  # 对话模型配置
  conversation_model:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-plus"
  # 工具调用/Function Call 模型配置
  tool_call_model:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-plus"
  # 复杂推理模型配置
  reasoning_model:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://api.deepseek.com/v1"
    model_name: "deepseek-reasoner"
  # 文生图模型配置
  text2image:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis"
    model_name: "wanx2.0-t2i-turbo"
  # 多模态 (视觉) 模型配置
  qwen_vl:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen-vl-plus"

  # Embedding 模型配置 (用于向量化)
  embedding:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "text-embedding-v4"

  # Rerank 模型配置 (用于重排序召回结果)
  rerank:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank"
    model_name: "gte-rerank-v2"

# 外部工具 (Tool) 配置
tools:
  # 高德地图天气 API 配置
  weather:
    api_key: "your-amap-api-key"
    endpoint: "https://restapi.amap.com/v3/weather/weatherInfo?parameters"
  # Tavily 联网搜索 API 配置 (注意配额限制)
  tavily:
    api_key: "tvly-dev-xxxxxxxxxxxxxxxxxxxx"
  # SerpApi 上的 Google Search API 配置
  google:
    api_key: "your-serpapi-api-key"
  # 阿里云快递查询 API 配置
  delivery:
    api_key: "your-delivery-api-key"
    endpoint: "https://qyexpress.market.alicloudapi.com/composite/queryexpress"
  # BoCha 联网搜索 API 配置
  bocha:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    endpoint: "https://api.bochaai.com/v1/web-search"

# RAG (检索增强生成) 配置
rag:
  enable_summary: False # 是否对知识库片段进行摘要
  enable_elasticsearch: False # 是否启用 Elasticsearch 进行关键词搜索
  enable_ik_analyzer: False # 是否启用 Elasticsearch 的IK分词器

  retrival:
    top_k: 5 # 知识库召回的最大数量
    min_score: 0.2 # 知识库召回结果的最小相似度分数阈值

  split:
    chunk_size: 500 # 知识库文档分块的最大字符数
    overlap_size: 100 # 文档分块之间的重叠字符数

  # ES数据库配置，主要做关键词召回
  elasticsearch:
    hosts: "http://127.0.0.1:9200" # Elasticsearch 连接地址。如果 'enable_elasticsearch' 为 False，则不需要填写。

  # 向量数据库配置 (Vector DB)
  vector_db:
    host: "127.0.0.1"
    port: "19530"
    mode: "chroma" # 向量库模式: standalone (Milvus), lite (轻量Milvus), chroma (ChromaDB)

# 对象存储配置
storage:
  mode: "minio" # or oss

  oss:
    access_key_id: "your-oss-access-key-id"
    access_key_secret: "your-oss-access-key-secret"
    endpoint: "oss-cn-beijing.aliyuncs.com"
    bucket_name: "agentchat" # OSS 存储桶名称
    base_url: "https://your-bucket.oss-cn-beijing.aliyuncs.com" # 访问基础 URL

  minio:
    access_key_id: "minioadmin"
    access_key_secret: "minioadmin"
    endpoint: "minio:9000"
    bucket_name: "agentchat" # minio 存储桶名称
    base_url: "http://localhost:9000/agentchat" # 访问基础 URL

# 默认配置 (如图标 URL, 资源链接)
default_config:
  mcp_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/mcp/mcp.png"
  tool_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/default.png" # 工具默认图标 URL
  agent_logo_url: "https://agentchat.oss-cn-beijing.aliyuncs.com/icons/tools/bot.png" # Agent 默认图标 URL
  mars_daily_url: "https://news.aibase.com/zh/news" # 外部新闻链接
  memory_collection_name: "memory" # 记忆存储的集合名称

# 扩展功能：微信配置 (不添加也可正常运行)
wechat_config:
  token: "your-wechat-token"
  app_id: "your-wechat-app-id"
  secret: "your-wechat-app-secret"

# 追踪工具 Langfuse 配置
# 默认关闭：enabled 置为 true 且填入真实公私钥后才开始上报；
# 未装 langfuse 包 / 缺 Key / 初始化失败都会静默降级，不影响主链路。
langfuse:
  enabled: false
  trace_name: "agentchat"
  host: "https://cloud.langfuse.com"
  public_key: "your-langfuse-public-key" # Langfuse 公钥
  secret_key: "your-langfuse-secret-key" # Langfuse 私钥
  user_id: "your-user-id" # 用户 ID
  trace_chat: true # 是否建立对话级 trace 根（模型调用级埋点不受此开关影响）

# 语义缓存（默认关闭）
# 仅缓存「单轮、自包含」的知识库问答：无附件 + 未开长期记忆 + 会话首轮才走缓存。
# threshold 必须先用 scripts/calibrate_threshold.py 在真实问答对上标定再启用 ——
# 未标定就开会把 A 问题的答案误返回给 B 问题，且用户无从察觉。
# kb_version 在知识库内容发生变更时手动 +1，旧答案即整体失效。
semantic_cache:
  enabled: false
  threshold: 0.90
  ttl: 86400
  kb_version: "v1"

# 接口白名单路径
whitelist_paths: ["/api/v1/mcp/*"]
