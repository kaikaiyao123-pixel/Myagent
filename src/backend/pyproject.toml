[project]
name = "agentchat"
version = "2.5.0"
description = "An intelligent agent communication platform based on LLM"
authors = [{ name = "tianmingguang", email = "2593666979@qq.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.2.15",
    "langchain-community==0.4.1",
    "pdf2docx==0.5.8",
    "loguru==0.7.3",
    "langchain-openai==1.0.2",
    "dashscope==1.25.0",
    "tavily-python==0.7.12",
    "mcp==1.27.0",
    "fastapi==0.121.0",
    "sqlmodel==0.0.27",
    "pytz==2025.2",
    "redis==7.0.1",
    "oss2==2.19.1",
    "pypandoc==1.15",
    "elasticsearch==8.19.0",
    "pymilvus==2.6.3",
    "pymupdf4llm==0.1.8",
    "aiofiles==25.1.0",
    "chromadb==1.3.4",
    "requests-html==0.10.0",
    "selenium==4.38.0",
    "pymysql==1.1.2",
    "aiomysql==0.3.2",
    "google-search-results==2.4.2",
    "arxiv==2.3.0",
    "html2image==2.0.7",
    "lxml-html-clean==0.4.3",
    "pyfiglet==1.0.4",
    "minio==7.2.20",
    "rsa==4.9.1",
    "tiktoken==0.12.0",
    "langfuse==5.0.4",
    "cachetools>=7.0.5",
]

# 仅测试用依赖：CI 中 `pip install fakeredis` 单独装，或 `uv sync --extra test`。
# 生产镜像走 `uv sync --frozen`（不启用 extra），因此 fakeredis 不会进入约 2.6GB 的
# 运行时 .venv —— 它只在真 Redis 协议端到端测试（scripts/test_semantic_cache_redis_e2e.py）
# 中作为 redis.StrictRedis 的内存替身使用，生产代码本身不 import 它。
[project.optional-dependencies]
test = ["fakeredis>=2.40"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentchat*"]
